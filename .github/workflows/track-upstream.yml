name: 2. Codex updates and release status
run-name: Check official Codex updates and pending npm publication

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codux-upstream-tracker
  cancel-in-progress: false

jobs:
  npm_status:
    name: Recheck pending npm publication (no rebuild)
    if: vars.CODUX_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report or resume the current release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/release_workflow.py retry

  candidate:
    name: Check stable Codex and prepare an update PR
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.track.outputs.changed }}
      head_sha: ${{ steps.track.outputs.head_sha }}
      codux_version: ${{ steps.track.outputs.codux_version }}
      upstream_version: ${{ steps.track.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: track
        name: Prepare patch and update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/track_upstream.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-report
          overwrite: true
          path: .build/upstream-report.json

  pending:
    name: Mark candidate checks as running
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.candidate.outputs.head_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA,
              state: 'pending', context: 'Codux / Windows native',
              description: 'Regression tests, release build, and npm installation',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  verify:
    name: Candidate Codux ${{ needs.candidate.outputs.codux_version }} / Codex ${{ needs.candidate.outputs.upstream_version }}
    needs: [candidate, pending]
    if: needs.candidate.outputs.changed == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      platform: windows
      ref: ${{ needs.candidate.outputs.head_sha }}
    permissions:
      contents: read

  result:
    name: Candidate result - review required before release
    needs: [candidate, verify]
    if: always() && needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.candidate.outputs.head_sha }}
          RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA,
              state: ok ? 'success' : 'failure', context: 'Codux / Windows native',
              description: ok ? 'Windows build and npm installation passed' : 'Validation did not pass; inspect the workflow logs',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await core.summary.addHeading('Codex update candidate')
              .addRaw(ok ? 'Windows checks passed. This is an update candidate, not a published release. Review and merge the PR to start publication.'
                         : 'Candidate verification failed. The installed and published release is unchanged.')
              .write();

name: Verify pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: codux-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    # The tracker verifies its own token-created PR; human edits are checked here.
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/native-build.yml
    with:
      platform: windows
      ref: ${{ github.event.pull_request.head.sha }}

  result:
    needs: verify
    if: always() && needs.verify.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA,
              state: ok ? 'success' : 'failure', context: 'Codux / Windows native',
              description: ok ? 'Windows build and npm installation passed' : 'Validation did not pass; inspect the workflow logs',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

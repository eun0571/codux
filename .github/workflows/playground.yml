name: 3. Browser playground
run-name: "${{ github.event_name == 'pull_request' && format('Playground check PR #{0}', github.event.pull_request.number) || github.ref_name == github.event.repository.default_branch && 'Playground deploy' || 'Playground check' }} | Codux 0.1.15 | Codex 0.172.0 | patch 66"

on:
  push:
    branches: [main]
    paths: ['playground/**', 'scripts/build_playground.py', 'scripts/test_playground.cjs', 'scripts/serve_playground.py', 'scripts/test_playground_server.py', 'scripts/workflow_labels.py', 'release.json', 'upstream.lock.json', '.github/workflows/playground.yml']
  pull_request:
    paths: ['playground/**', 'scripts/build_playground.py', 'scripts/test_playground.cjs', 'scripts/serve_playground.py', 'scripts/test_playground_server.py', 'scripts/workflow_labels.py', 'release.json', 'upstream.lock.json', '.github/workflows/playground.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build browser preview
    runs-on: ubuntu-22.04
    outputs:
      label: ${{ steps.identity.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build the static demo
        id: identity
        run: |
          python scripts/workflow_labels.py --check
          python scripts/workflow_labels.py --describe --purpose "Browser playground check (does not publish npm)"
          python scripts/build_playground.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/playground

  deploy:
    name: Playground deploy | ${{ needs.build.outputs.label }}
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Show the deployed preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_LABEL: ${{ needs.build.outputs.label }}
        run: |
          printf '## Playground deployed\n\n%s\n\n[Open the preview](%s)\n\nThis updates the website, not the npm application.\n' "$RELEASE_LABEL" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
